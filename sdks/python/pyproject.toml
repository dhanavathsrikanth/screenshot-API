[project]
name = "screenshotapi"
version = "1.0.0"
description = "Official ScreenshotAPI client — sync/async/bulk captures and HMAC signed GET URLs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
